services:
  postgres-db:
    build:
      context: .
      dockerfile: Dockerfile
    image: tp1-postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-usr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwd}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend-api:
    build:
      context: ./simple-api-student-main
      dockerfile: Dockerfile
    image: tp1-backend-api
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-usr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwd}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  http-server:
    build:
      context: ./http-server
      dockerfile: Dockerfile
    image: tp1-http-server
    depends_on:
      - backend-api
    ports:
      - 80:80
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres-data:
