name: Build And Push Docker Images

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

jobs:
  build-and-push-docker-image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare Docker image prefix
        id: docker-meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing DOCKERHUB_USERNAME secret."
            exit 1
          fi

          DOCKERHUB_USERNAME_LOWER=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')

          if ! printf '%s' "$DOCKERHUB_USERNAME_LOWER" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
            echo "Invalid DOCKERHUB_USERNAME value for Docker tags: $DOCKERHUB_USERNAME"
            exit 1
          fi

          echo "image_prefix=$DOCKERHUB_USERNAME_LOWER" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api-student-main
          tags: ${{ steps.docker-meta.outputs.image_prefix }}/tp-devops-simple-api:latest
          push: true

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.docker-meta.outputs.image_prefix }}/tp-devops-postgres-db:latest
          push: true

      - name: Build and push http server image
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ steps.docker-meta.outputs.image_prefix }}/tp-devops-http-server:latest
          push: true
